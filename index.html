<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ESP Visuals</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <b>esp.visuals</b>
        <span>visual editor</span>
      </header>
      <nav id="groups">
        <button class="active" data-group="Enemy">Enemy</button>
        <button data-group="Friendly">Friendly</button>
        <button data-group="Self">Self</button>
        <button data-group="World">World</button>
        <button disabled>Extra</button>
      </nav>
      <div class="frame">
        <div class="framebar">
          <span>Preview</span>
          <div class="tools">
            <span id="subjectLabel">R6</span>
            <button class="active" data-view="2d">2D</button>
            <button data-view="3d">3D</button>
            <button id="resetView">Reset</button>
          </div>
        </div>
        <div id="viewport">
          <canvas id="overlay"> </canvas>
          <span class="scene-label" id="sceneLabel" role="status">Loading model…</span>
        </div>
      </div>
      <div class="heading">
        <b>Box</b>
        <label> <input id="enabled" type="checkbox" checked /> Enabled</label>
      </div>
      <div class="settings">
        <div>
          <div class="section">Geometry</div>
          <div class="row">
            <span>Style</span>
            <div class="choice">
              <button data-style="full">Full</button>
              <button class="active" data-style="corner">Corner</button>
            </div>
          </div>
          <div class="range">
            <div>
              <label for="thickness">Thickness</label>
              <output id="thicknessOut"> </output>
            </div>
            <input id="thickness" type="range" min=".5" max="5" step=".5" />
          </div>
          <div class="range">
            <div>
              <label for="padding">Padding</label>
              <output id="paddingOut"> </output>
            </div>
            <input id="padding" type="range" min="0" max="20" />
          </div>
          <div class="range" id="cornerRow">
            <div>
              <label for="cornerLength">Corner length</label>
              <output id="cornerLengthOut"> </output>
            </div>
            <input id="cornerLength" type="range" min="10" max="50" />
          </div>
        </div>
        <div>
          <div class="section">Appearance</div>
          <div class="row">
            <span>Color</span>
            <div class="color">
              <small id="colorHex"> </small>
              <input id="color" type="color" aria-label="color" />
            </div>
          </div>
          <div class="range">
            <div>
              <label for="opacity">Opacity</label>
              <output id="opacityOut"> </output>
            </div>
            <input id="opacity" type="range" min="0" max="100" step="5" />
          </div>
          <div class="row">
            <span>Outline</span>
            <input id="outline" type="checkbox" aria-label="Outline" />
          </div>
          <div class="row" id="outlineRow">
            <span>Outline color</span>
            <div class="color">
              <small id="outlineColorHex"> </small>
              <input id="outlineColor" type="color" aria-label="outlineColor" />
            </div>
          </div>
          <div class="row">
            <span>Fill</span>
            <input id="fill" type="checkbox" aria-label="Fill" />
          </div>
          <div id="fillOptions">
            <div class="row">
              <span>Fill color</span>
              <div class="color">
                <small id="fillColorHex"> </small>
                <input id="fillColor" type="color" aria-label="fillColor" />
              </div>
            </div>
            <div class="range">
              <div>
                <label for="fillOpacity">Fill opacity</label>
                <output id="fillOpacityOut"> </output>
              </div>
              <input id="fillOpacity" type="range" min="0" max="100" step="5" />
            </div>
          </div>
        </div>
      </div>
      <footer>
        <button id="resetSettings">Reset settings</button>
      </footer>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
